<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmartBiz — Submissions</title>
<style>
  :root{--brand:#0f4c81;--ink:#1f2733;--muted:#667085;--line:#e3e8ef;--bg:#f4f7fb}
  *{box-sizing:border-box}html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
  .wrap{max-width:980px;margin:0 auto;padding:24px 16px 64px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
  h1{margin:0;font-size:22px;font-weight:800}
  h1 small{font-weight:500;color:var(--muted);font-size:14px;display:block;margin-top:2px}
  .btn{font:inherit;font-weight:700;font-size:14px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;transition:.15s;color:var(--ink)}
  .btn:hover{border-color:#c9d4e3}
  .btn.primary{background:linear-gradient(135deg,#0f4c81,#1367a8);color:#fff;border:none}
  .btn.primary:hover{transform:translateY(-1px)}
  .btn:disabled{opacity:.6;cursor:progress}
  .panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .panel label{display:block;font-weight:700;font-size:14px;margin-bottom:8px}
  .panel input{width:100%;padding:11px 13px;font:inherit;font-size:15px;border:1px solid var(--line);border-radius:10px;outline:none}
  .panel input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(15,76,129,.12)}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
  .meta{font-size:13px;color:var(--muted);margin-bottom:12px}
  .meta b{color:var(--ink)}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  th{background:#eef4fb;color:var(--brand);text-align:left;padding:11px 14px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:800}
  td{padding:11px 14px;border-top:1px solid var(--line);font-size:14px;vertical-align:top}
  tbody tr{cursor:pointer;transition:.12s}
  tbody tr:hover{background:#f8fbff}
  tbody tr.open{background:#eef4fb}
  td.id{color:var(--muted);font-variant-numeric:tabular-nums;width:56px}
  td.name{font-weight:700}
  td.when{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;width:150px}
  td.caret{width:28px;text-align:right;color:var(--muted)}
  .detail{background:#fbfcfe}
  .detail td{padding:16px 20px}
  .qa{border-bottom:1px dashed #eaeef4;padding:10px 0}
  .qa:last-child{border:none}
  .qa .q{font-weight:700;font-size:13.5px;margin-bottom:3px}
  .qa .a{color:#0b4f84;font-size:14px;white-space:pre-wrap}
  .qa .a.empty{color:#98a2b3;font-style:italic}
  .state{padding:36px 16px;text-align:center;color:var(--muted);font-size:14px;background:#fff;border:1px dashed var(--line);border-radius:14px}
  .state.error{color:#b42318;border-color:#fecdd3;background:#fff5f5}
  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#1f2733;color:#fff;padding:11px 18px;border-radius:11px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.22s;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.22);max-width:calc(100% - 32px);text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media(max-width:640px){
    header h1{font-size:18px}
    table{font-size:13px}
    th,td{padding:9px 10px}
    td.when{white-space:normal}
    td.id,td.caret{display:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>SmartBiz — Submissions<small>OMXE Technologies · internal dashboard</small></h1>
    <div style="display:flex;gap:8px"><button id="csvBtn" class="btn" style="display:none">Download CSV</button><button id="logoutBtn" class="btn" style="display:none">Lock</button></div>
  </header>

  <!-- Auth panel -->
  <div id="authPanel" class="panel" hidden>
    <label for="tokenInput">Admin token</label>
    <input id="tokenInput" type="password" placeholder="Paste ADMIN_TOKEN…" autocomplete="off">
    <div class="row">
      <button id="unlockBtn" class="btn primary">Unlock</button>
      <button id="clearBtn" class="btn">Clear stored</button>
    </div>
    <p class="meta" style="margin:10px 0 0">The token is the <code>ADMIN_TOKEN</code> env var set on the backend. It is stored in <code>sessionStorage</code> and cleared when you close the tab.</p>
  </div>

  <!-- Content area -->
  <div id="content"></div>
</div>
<div id="toast" class="toast"></div>

<script>
const API = '';   // same origin
let TOKEN = '';

const $ = id => document.getElementById(id);
const content = $('content');
const authPanel = $('authPanel');
const logoutBtn = $('logoutBtn');

let toastTimer;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 3000);
}

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function fmtDate(sql){
  // SQLite "YYYY-MM-DD HH:MM:SS" is UTC
  if (!sql) return '—';
  const d = new Date(sql.replace(' ', 'T') + 'Z');
  return d.toLocaleString('en-GB', {
    day:'2-digit', month:'short', year:'numeric',
    hour:'2-digit', minute:'2-digit'
  });
}

function setAuthed(on){
  authPanel.hidden = on;
  logoutBtn.style.display = on ? '' : 'none';
  const csvBtn = document.getElementById('csvBtn');
  if (csvBtn) csvBtn.style.display = on ? '' : 'none';
  if (!on) content.innerHTML = '';
}

/* ---------- auth ---------- */
function unlock(){
  const t = $('tokenInput').value.trim();
  if (!t){ $('tokenInput').focus(); return; }
  TOKEN = t;
  sessionStorage.setItem('smartbiz_admin', t);
  load();
}

$('unlockBtn').addEventListener('click', unlock);
$('tokenInput').addEventListener('keydown', e=>{ if (e.key === 'Enter') unlock(); });

$('clearBtn').addEventListener('click', ()=>{
  sessionStorage.removeItem('smartbiz_admin');
  TOKEN = '';
  $('tokenInput').value = '';
  toast('Stored token cleared');
});

logoutBtn.addEventListener('click', ()=>{
  sessionStorage.removeItem('smartbiz_admin');
  TOKEN = '';
  setAuthed(false);
  $('tokenInput').value = '';
  $('tokenInput').focus();
});

/* ---------- api ---------- */
async function api(path){
  const r = await fetch(API + path, { headers: { 'x-admin-token': TOKEN } });
  if (r.status === 401) throw new Error('UNAUTHORIZED');
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

/* ---------- load list ---------- */
async function load(){
  setAuthed(true);
  content.innerHTML = '<div class="state">Loading submissions…</div>';

  let data;
  try {
    data = await api('/api/submissions?limit=500');
  } catch (err) {
    if (err.message === 'UNAUTHORIZED'){
      sessionStorage.removeItem('smartbiz_admin');
      TOKEN = '';
      setAuthed(false);
      content.innerHTML = '<div class="state error">Token rejected. Check <code>ADMIN_TOKEN</code> on the backend and try again.</div>';
      $('tokenInput').focus();
      return;
    }
    content.innerHTML = '<div class="state error">Could not load: ' + esc(err.message) + '</div>';
    return;
  }

  render(data.submissions);
}

/* ---------- render ---------- */
function render(rows){
  if (!rows.length){
    content.innerHTML = '<div class="state">No submissions yet. Share the form link so answers start arriving.</div>';
    return;
  }

  const total = rows.length;
  const html = `
    <p class="meta"><b>${total}</b> submission${total===1?'':'s'} (newest first) · <a href="${API}/api/submissions?token=" target="_blank" hidden></a></p>
    <table>
      <thead><tr>
        <th>#</th><th>Business</th><th>Submitted</th><th></th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  `;
  content.innerHTML = html;
  const tbody = $('tbody');

  rows.forEach(row=>{
    const tr = document.createElement('tr');
    tr.dataset.id = row.id;
    tr.innerHTML = `
      <td class="id">${row.id}</td>
      <td class="name">${esc(row.business_name)}</td>
      <td class="when">${esc(fmtDate(row.created_at))}</td>
      <td class="caret">▸</td>
    `;
    tr.addEventListener('click', ()=>toggle(row.id, tr));
    tbody.appendChild(tr);
  });

  // Auto-expand the newest row for a fast first look
  const first = tbody.querySelector('tr');
  if (first) first.click();
}

async function toggle(id, tr){
  const existing = tr.nextElementSibling;
  if (existing && existing.classList.contains('detail')){
    existing.remove();
    tr.classList.remove('open');
    tr.querySelector('.caret').textContent = '▸';
    return;
  }

  // Collapse any other open row
  document.querySelectorAll('tr.detail').forEach(el=>el.remove());
  document.querySelectorAll('tr.open').forEach(el=>{
    el.classList.remove('open');
    const c = el.querySelector('.caret'); if (c) c.textContent = '▸';
  });

  tr.classList.add('open');
  tr.querySelector('.caret').textContent = '▾';

  const detail = document.createElement('tr');
  detail.className = 'detail';
  detail.innerHTML = '<td colspan="4"><div class="state">Loading answers…</div></td>';
  tr.parentNode.insertBefore(detail, tr.nextSibling);

  try {
    const { submission } = await api('/api/submissions/' + id);
    const answers = submission.answers || {};
    const keys = Object.keys(answers);
    if (!keys.length){
      detail.querySelector('td').innerHTML = '<div class="state">No answers recorded.</div>';
      return;
    }
    const items = keys.map(k=>{
      const item = answers[k];
      const q = (item && item.question) ? item.question : k;
      const a = (item && item.answer != null) ? item.answer : '';
      const empty = !a || !String(a).trim();
      return `<div class="qa">
        <div class="q">${esc(q)}</div>
        <div class="a ${empty?'empty':''}">${empty ? 'Not answered' : esc(a)}</div>
      </div>`;
    }).join('');
    const header = `<p class="meta" style="margin:0 0 10px"><b>${esc(submission.businessName)}</b> · #${submission.id} · ${esc(fmtDate(submission.createdAt))}${submission.ip ? ' · IP '+esc(submission.ip) : ''}</p>`;
    detail.querySelector('td').innerHTML = header + items;
  } catch (err){
    detail.querySelector('td').innerHTML = '<div class="state error">Could not load answers: ' + esc(err.message) + '</div>';
  }
}


/* ---------- CSV download ---------- */
(function(){
  const csvBtn = document.getElementById('csvBtn');
  if (!csvBtn) return;
  csvBtn.addEventListener('click', async () => {
    csvBtn.disabled = true;
    const original = csvBtn.textContent;
    csvBtn.textContent = 'Preparing…';
    try {
      const res = await fetch(API + '/api/submissions.csv', {
        headers: { 'x-admin-token': TOKEN }
      });
      if (res.status === 401) {
        sessionStorage.removeItem('smartbiz_admin');
        TOKEN = '';
        setAuthed(false);
        throw new Error('Token rejected — please log in again');
      }
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const blob = await res.blob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'smartbiz_submissions_' + new Date().toISOString().slice(0,10) + '.csv';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      toast('CSV downloaded');
    } catch (err) {
      toast('CSV download failed: ' + err.message);
    } finally {
      csvBtn.disabled = false;
      csvBtn.textContent = original;
    }
  });
})();

/* ---------- boot ---------- */
(function boot(){
  const saved = sessionStorage.getItem('smartbiz_admin');
  if (saved){
    TOKEN = saved;
    setAuthed(true);
    load();
  } else {
    setAuthed(false);
    $('tokenInput').focus();
  }
})();
</script>
</body>
</html>
